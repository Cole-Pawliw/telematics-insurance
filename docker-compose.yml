# Usage: copy .env.example to .env, set the passwords, then run `docker compose up --build`.

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    configs:
      # Runs once, when the database is first created.
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # -h forces a TCP check, which only succeeds after the init script has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Services ---
  policy-api:
    build:
      context: .
      dockerfile: src/Services/Policy/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PolicyDb: Host=postgres;Database=${POSTGRES_DB};Username=policy_service;Password=${POLICY_DB_PASSWORD};GSS Encryption Mode=Disable
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "${POLICY_SERVICE_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  telematics-api:
    build:
      context: .
      dockerfile: src/Services/Telematics/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TelematicsDb: Host=postgres;Database=${POSTGRES_DB};Username=telematics_service;Password=${TELEMATICS_DB_PASSWORD};GSS Encryption Mode=Disable
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "${TELEMATICS_SERVICE_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  billing-api:
    build:
      context: .
      dockerfile: src/Services/Billing/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BillingDb: Host=postgres;Database=${POSTGRES_DB};Username=billing_service;Password=${BILLING_DB_PASSWORD};GSS Encryption Mode=Disable
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "${BILLING_SERVICE_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  # --- Web frontend: serves the React app and forwards /api calls to the services ---
  web:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - policy-api
      - telematics-api
      - billing-api
    restart: on-failure

configs:
  # One login per service, each owning only its own schema. Other schemas are not visible to it.
  postgres-init:
    content: |
      CREATE ROLE policy_service LOGIN PASSWORD '${POLICY_DB_PASSWORD}';
      CREATE ROLE telematics_service LOGIN PASSWORD '${TELEMATICS_DB_PASSWORD}';
      CREATE ROLE billing_service LOGIN PASSWORD '${BILLING_DB_PASSWORD}';

      CREATE SCHEMA policy AUTHORIZATION policy_service;
      CREATE SCHEMA telematics AUTHORIZATION telematics_service;
      CREATE SCHEMA billing AUTHORIZATION billing_service;

      -- EF Core migrations run "CREATE SCHEMA IF NOT EXISTS", which Postgres only allows
      -- for logins with CREATE permission on the database.
      GRANT CREATE ON DATABASE ${POSTGRES_DB} TO policy_service, telematics_service, billing_service;
