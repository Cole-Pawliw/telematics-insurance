server {
    listen 80;

    # Look up the API containers through Docker's internal DNS on each request instead of once
    # at startup, so nginx starts even if the APIs are not running yet (it returns 502 until they are).
    resolver 127.0.0.11 valid=10s;
    set $policy_api http://policy-api:8080;
    set $telematics_api http://telematics-api:8080;
    set $billing_api http://billing-api:8080;

    # React app; unknown paths fall back to index.html.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API calls are forwarded to the services by their Docker Compose names.
    location /api/policies {
        proxy_pass $policy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/trips {
        proxy_pass $telematics_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/billing {
        proxy_pass $billing_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
